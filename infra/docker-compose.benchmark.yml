# Use only with docker-compose.test.yml and the fixed pos-phase6-bench project.
# No operational database, bind-mounted data or externally reachable ports.
services:
  api:
    cpus: 2
    mem_limit: 1g
    environment:
      POSTGRES_POOL_MAX: 10
      POSTGRES_CONNECTION_TIMEOUT_MS: 5000
      POSTGRES_STATEMENT_TIMEOUT_MS: 30000
      POSTGRES_LOCK_TIMEOUT_MS: 5000
      ENABLE_DATABASE_RESTORE: 'false'
      ENABLE_LEGACY_OVERWRITE: 'false'
  db:
    cpus: 2
    mem_limit: 2g
  redis:
    cpus: 0.25
    mem_limit: 128m
