services:
  reverse-proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-12h}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-pos_auth}
      AUTH_COOKIE_MAX_AGE_SECONDS: ${AUTH_COOKIE_MAX_AGE_SECONDS:-43200}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-posdb}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://pos.localhost}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?Generate a local environment with node infra/setup-dev-env.mjs}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
      POSTGRES_LOCK_TIMEOUT_MS: ${POSTGRES_LOCK_TIMEOUT_MS:-5000}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_RATE_LIMIT_ACCOUNT: ${LOGIN_RATE_LIMIT_ACCOUNT:-10}
      LOGIN_RATE_LIMIT_IP: ${LOGIN_RATE_LIMIT_IP:-100}
      LOGIN_RATE_LIMIT_GLOBAL: ${LOGIN_RATE_LIMIT_GLOBAL:-1000}
      ARCHIVE_MAX_ENTRIES: ${ARCHIVE_MAX_ENTRIES:-5000}
      ARCHIVE_MAX_UNCOMPRESSED_BYTES: ${ARCHIVE_MAX_UNCOMPRESSED_BYTES:-536870912}
      ARCHIVE_MAX_FILE_BYTES: ${ARCHIVE_MAX_FILE_BYTES:-536870912}
      ARCHIVE_MAX_DEPTH: ${ARCHIVE_MAX_DEPTH:-12}
      ARCHIVE_TIMEOUT_MS: ${ARCHIVE_TIMEOUT_MS:-60000}
      ENABLE_DATABASE_RESTORE: ${ENABLE_DATABASE_RESTORE:-false}
      ENABLE_LEGACY_OVERWRITE: ${ENABLE_LEGACY_OVERWRITE:-false}
      BACKUP_OPERATION_TIMEOUT_MS: ${BACKUP_OPERATION_TIMEOUT_MS:-600000}
      BACKUP_SIMULATION_TIMEOUT_MS: ${BACKUP_SIMULATION_TIMEOUT_MS:-300000}
      BACKUP_MAX_UPLOAD_SIZE: ${BACKUP_MAX_UPLOAD_SIZE:-104857600}
      BACKUP_PATH: /var/backups/pos
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-268435456}
      BACKUP_REPLICA_PATH: ${BACKUP_REPLICA_PATH:-}
      BACKUP_REQUIRE_REPLICA: ${BACKUP_REQUIRE_REPLICA:-false}
      IMPORT_PATH: ${IMPORT_PATH:-/tmp/imports/pos}
      LEGACY_IMPORT_MAX_FILES: ${LEGACY_IMPORT_MAX_FILES:-50}
      LEGACY_IMPORT_MAX_FILE_SIZE: ${LEGACY_IMPORT_MAX_FILE_SIZE:-104857600}
      LEGACY_IMPORT_QUEUE_NAME: ${LEGACY_IMPORT_QUEUE_NAME:-legacy-import}
      LEGACY_IMPORT_DLQ_NAME: ${LEGACY_IMPORT_DLQ_NAME:-legacy-import-dlq}
      LEGACY_IMPORT_JOB_ATTEMPTS: ${LEGACY_IMPORT_JOB_ATTEMPTS:-3}
      LEGACY_IMPORT_JOB_BACKOFF_MS: ${LEGACY_IMPORT_JOB_BACKOFF_MS:-5000}
      PRINT_AGENT_URL: ${PRINT_AGENT_URL:-http://host.docker.internal:9222/print}
      PRINT_AGENT_TIMEOUT_MS: ${PRINT_AGENT_TIMEOUT_MS:-8000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-}
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backups:/var/backups/pos

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-/api/v1}

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-posdb}
      TZ: ${TZ:-America/Recife}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
  backups: {}
