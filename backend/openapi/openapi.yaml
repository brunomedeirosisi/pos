    printAgentToken:
      type: apiKey
      in: header
      name: x-print-agent-token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: pos_auth
