  /api/v1/admin/backups:
    get:
      tags:
        - Administration
      summary: List backups
      responses:
        '200':
          description: Available system backups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemBackup'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/backups/preflight:
    get:
      tags: [Administration]
      summary: Check backup tooling and storage readiness
      description: Checks PostgreSQL 16 clients, writable storage, atomic publication support, free-space reserve and configured replica. Requires system:backup:read. A configured replica does not prove that its physical storage is off-host.
      responses:
        '200':
          description: Backup tooling and configured storage are ready.
          content:
            application/json:
              schema:
                type: object
                required: [ready, serverMajor, pgDumpVersion, psqlVersion, primary, replica, retentionCount]
                properties:
                  ready: { type: boolean, enum: [true] }
                  serverMajor: { type: integer, enum: [16] }
                  pgDumpVersion: { type: string }
                  psqlVersion: { type: string }
                  primary:
                    type: object
                    properties:
                      writable: { type: boolean }
                      availableBytes: { type: integer, format: int64 }
                  replica:
                    type: object
                    properties:
                      configured: { type: boolean }
                      required: { type: boolean }
                      storage: { type: object, nullable: true }
                  retentionCount: { type: integer }
        '503':
          description: Tooling, PostgreSQL compatibility or storage check failed. No readiness guarantee is issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean, enum: [false] }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/backup:
    post:
      tags:
        - Administration
      summary: Create backup
      description: Triggers a full database backup and registers the archive.
      responses:
        '409':
          $ref: '#/components/responses/ConflictError'
        '201':
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBackup'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/backup/upload:
    post:
      tags:
        - Administration
      summary: Upload backup archive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup archive (.zip)
              required:
                - file
      responses:
        '409':
          $ref: '#/components/responses/ConflictError'
        '201':
          description: Backup uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBackup'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/backup/{filename}:
    delete:
      tags:
        - Administration
      summary: Delete backup
      parameters:
        - $ref: '#/components/parameters/BackupFilename'
      responses:
        '409':
          $ref: '#/components/responses/ConflictError'
        '204':
          description: Backup removed.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/backup/{filename}/download:
    get:
      tags:
        - Administration
      summary: Download backup archive
      parameters:
        - $ref: '#/components/parameters/BackupFilename'
      responses:
        '200':
          description: Backup archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/restore:
    post:
      tags:
        - Administration
      summary: Restore backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: Restore accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/import/legacy:
    post:
      tags:
        - Administration
      summary: Import legacy DBF data
      description: >
        Uploads legacy DBF/DBT files (or a ZIP archive) and queues the ETL pipeline
        to rebuild the normalized database from legacy staging tables.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LegacyImportRequest'
      responses:
        '202':
          description: Import accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/import/legacy/{sessionId}/status:
    get:
      tags:
        - Administration
      summary: Get legacy import status
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
      responses:
        '200':
          description: Current status for the legacy import.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/import/legacy/{sessionId}/report:
    get:
      tags:
        - Administration
      summary: Download legacy import reconciliation report
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
      responses:
        '200':
          description: CSV reconciliation report.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackupFilename:
      name: filename
      in: path
      required: true
      description: Backup archive filename.
      schema:
        type: string
    ImportSessionId:
      name: sessionId
      in: path
      required: true
      description: Import session identifier.
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      description: Case insensitive partial match on name, legacy code, or identifier.
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      description: Maximum number of records to return (default 100, max 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
  responses:
    ValidationError:
      description: Request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    BadRequestError:
      description: Request is syntactically valid but semantically invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: bad request
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: resource not found
    ConflictError:
      description: Unique constraint violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: conflict
    UnauthorizedError:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: unauthorized
    ForbiddenError:
      description: Authenticated user lacks permission for the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: forbidden
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: internal_error
  schemas:
    ProductGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - id
        - name
    ProductGroupWrite:
      type: object
      properties:
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - name
    ProductGroupPatch:
      allOf:
        - $ref: '#/components/schemas/ProductGroupWrite'
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
        barcode:
          type: string
          nullable: true
        group_id:
          type: string
          format: uuid
          nullable: true
        reference:
          type: string
          nullable: true
        min_stock:
          type: number
          format: float
          nullable: true
        price_cash:
          type: number
          format: float
          nullable: true
        price_base:
          type: number
          format: float
          nullable: true
      required:
        - id
        - name
    ProductWrite:
      type: object
      properties:
        name:
          type: string
        barcode:
          type: string
          nullable: true
        group_id:
          type: string
          format: uuid
          nullable: true
        reference:
          type: string
          nullable: true
        min_stock:
          type: number
          format: float
          nullable: true
        price_cash:
          type: number
          format: float
          nullable: true
        price_base:
          type: number
          format: float
          nullable: true
      required:
        - name
    ProductPatch:
      allOf:
        - $ref: '#/components/schemas/ProductWrite'
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
        cpf:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - delinquent
            - inactive
        credit_limit:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - id
        - name
        - status
    CustomerWrite:
      type: object
      properties:
        name:
          type: string
        cpf:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
        cep:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - delinquent
            - inactive
          default: active
        credit_limit:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name
    CustomerPatch:
      allOf:
        - $ref: '#/components/schemas/CustomerWrite'
    CustomerDetails:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            totals:
              type: object
              properties:
                total_charges:
                  type: number
                  format: float
                total_payments:
                  type: number
                  format: float
                current_balance:
                  type: number
                  format: float
                last_payment_date:
                  type: string
                  format: date
                  nullable: true
              required:
                - total_charges
                - total_payments
                - current_balance
          required:
            - totals
    CustomerPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        payment_date:
          type: string
          format: date
          nullable: true
        method:
          type: string
          enum:
            - cash
            - card
