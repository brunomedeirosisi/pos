    SaleItemWrite:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: number
          format: float
          minimum: 0.001
          maximum: 99999999999.999
          multipleOf: 0.001
        unit_price:
          type: number
          format: float
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Optional client preview price. The API recalculates the official unit price from the catalog.
        total:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Optional client preview line total. The API recalculates the official line total from the catalog.
      required:
        - product_id
        - quantity
    SaleCreate:
      type: object
      description: >
        The checkout request only needs product ids, quantities, discount, and
        payment information. The API recalculates official catalog prices and
        final totals before saving the sale. Calculation policy line-half-up-money-2-quantity-3/v1:
        round each line half up to cents, then sum lines and subtract the discount.
        Money uses at most 2 decimal places; quantity uses at most 3. Excess precision,
        positive lines rounded to zero and numeric(14,scale) overflow receive HTTP 400.
        payment_method and amount_paid are required and cannot be null. Cash/card/bank/other
        require full settlement. Credit requires customer_id and zero payment; credit_with_entry
        requires customer_id and a positive payment no greater than the total.
      properties:
        emission_date:
          type: string
          format: date
        paid_at:
          type: string
          format: date-time
        order_number:
          type: string
          nullable: true
        seller_id:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          format: uuid
          nullable: true
        payment_term_id:
          type: string
          format: uuid
          nullable: true
        payment_method:
          type: string
          enum:
            - cash
            - card
            - bank
            - other
            - credit
            - credit_with_entry
        amount_paid:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Explicit amount tendered; never inferred by the API.
        change_amount:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          nullable: true
          description: Optional client preview field. The API recalculates the official change amount.
        subtotal:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          nullable: true
          description: Optional client preview subtotal. The API recalculates the official subtotal from the catalog.
        discount:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          nullable: true
          description: Requested absolute discount amount. The API validates it against the role percentage limit.
        total:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          nullable: true
          description: Optional client preview total. The API recalculates the official total from the catalog.
        source:
          type: string
          nullable: true
        source_key:
          type: string
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItemWrite'
      required:
        - items
        - payment_method
        - amount_paid
