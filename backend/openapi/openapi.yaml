  /api/v1/sales:
    get:
      tags:
        - Sales
      summary: List sales
      parameters:
        - name: from
          in: query
          description: Filter by emission date (inclusive, YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Filter by emission date (inclusive, YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: seller_id
          in: query
          description: Filter by seller identifier.
          schema:
            type: string
            format: uuid
        - name: customer_id
          in: query
          description: Filter by customer identifier.
          schema:
            type: string
            format: uuid
        - name: payment_term_id
          in: query
          description: Filter by payment term identifier.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of records to return (default 100, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Most recent sales first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
    post:
      tags:
        - Sales
      summary: Register sale
      description: >
        The API recalculates official item prices, subtotal, discount validation,
        total, pending amount, and change on the server. Client-submitted monetary
        fields are treated as hints only and normalized from the product catalog
        before persistence. Once the sale is completed, aggregated stock movements
        are also written per product with type `venda`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
      responses:
        '201':
          description: Sale created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sales/{id}:
    get:
      tags:
        - Sales
      summary: Get sale
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Sale with items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sales/{id}/receipt:
    get:
      tags:
        - Sales
      summary: Get sale receipt
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: locale
          in: query
          description: Receipt language.
          schema:
            type: string
            enum:
              - pt-BR
              - en
      responses:
        '200':
          description: Sale receipt payload and plain-text matrix layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReceipt'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sales/{id}/receipt/print:
    post:
      tags:
        - Sales
      summary: Print sale receipt
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleReceiptPrintRequest'
      responses:
        '202':
          description: Durable print request accepted; inspect job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReceiptPrintResult'
        '200':
          description: Receipt sent to the configured printer agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReceiptPrintResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/sales/{id}/cancel:
    post:
      tags:
        - Sales
      summary: Cancel sale
      description: >
        Cancels a sale when permitted by RBAC policy. Previously cancelled sales
        return 404 to prevent idempotency violations. Successful cancellation also
        writes the inverse stock movements with type `entrada`. If the cancellation
        would create a customer credit balance because prior customer payments are
        already registered, the API blocks the operation.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCancel'
      responses:
        '200':
          description: Sale cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '409':
          $ref: '#/components/responses/ConflictError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/users:
