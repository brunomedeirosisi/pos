openapi: 3.0.3
info:
  title: POS Platform API
  version: 0.1.0
  description: >
    REST API for the POS platform providing checkout, backoffice, and
    synchronization capabilities. The API is designed to be idempotent, secure,
    and ready for hybrid deployments.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Customers
  - name: Sales
  - name: Administration
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/v1/store-info:
    get:
      security: []
      summary: Public store identity for installer pairing
      responses:
        '200': { description: Store UUID and print mode; no secrets. }
        '503': { description: Store is not configured. }
  /api/v1/print-agent/enroll:
    post:
      security: []
      summary: Redeem an administrator-issued print enrollment capability
      description: Code expires in 15 minutes and binds one printer to one unique agent credential. A lost response may be retried with the same code and credential after consumption. Revoked credentials cannot be revived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, pattern: '^[a-f0-9]{48}$' }
                token: { type: string, pattern: '^[a-f0-9]{64}$', writeOnly: true }
              required: [code, token]
      responses:
        '200': { description: 'printer_id, display_name and store_id; never echoes the credential.' }
        '403': { description: Invalid/expired enrollment or consumed by another credential or revoked. }
  /api/v1/print-printers:
    get:
      summary: List printer identities and heartbeats (sales:read or printers:manage)
      responses:
        '200': { description: 'mode, store_id and printers with id/display_name/enabled/online/last_seen_at; never returns tokens or hashes or enrollment codes.' }
  /api/v1/print-printers/enrollments:
    post:
      summary: Generate a 15-minute pairing code (printers:manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { display_name: { type: string, minLength: 1, maxLength: 100 } }
              required: [display_name]
      responses:
        '201': { description: 'code, printer_id, expires_at and store_id. No-store response; the server stores only a hash.' }
        '403': { description: Missing management permission. }
        '409': { description: Too many pending enrollments (maximum twenty). }
  /api/v1/print-printers/{id}/revoke:
    post:
      summary: Revoke a Terminal credential without moving jobs (printers:manage)
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: 'Access revoked. Jobs stay at the original destination; an output already started may complete.' }
        '400': { description: Unknown printer or attempt to revoke the principal printer. }
        '403': { description: Missing management permission. }
  /api/v1/print-agent/claim:
    post:
      security: [{ printAgentToken: [] }]
      summary: Claim the next job exclusively for the authenticated printer
      description: Queue mode only. One live reservation per printer. x-print-printer-id selects the credential scope (principal if omitted for legacy compatibility). Response contains job metadata plus content, locale and claim_token, or job=null. Content is bounded to 1 MiB.
      responses:
        '200': { description: Claimed job or null; poll every two seconds while idle. }
        '403': { description: Invalid agent token. }
        '503': { description: Queue disabled. }
  /api/v1/print-agent/jobs/{id}/start:
    post:
      security: [{ printAgentToken: [] }]
      summary: Acknowledge start BEFORE invoking the spooler
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { claim_token: { type: string, format: uuid } }
              required: [claim_token]
      responses:
        '204': { description: Current claim is now spooling. }
        '409': { description: Claim expired or invalid; do not print. }
  /api/v1/print-agent/jobs/{id}/finish:
    post:
      security: [{ printAgentToken: [] }]
      summary: Acknowledge submitted/uncertain output or rejection before output
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claim_token: { type: string, format: uuid }
                outcome: { type: string, enum: [submitted, uncertain, failed] }
              required: [claim_token, outcome]
      responses:
        '204': { description: Idempotent acknowledgement; submitted means spooler accepted, not paper output. }
        '409': { description: Completion incompatible with claim/state. }
  /api/v1/print-agent/jobs/{id}:
    get:
      security: [{ printAgentToken: [] }]
      summary: Inspect metadata during agent crash recovery
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Job metadata. }
        '404': { description: Job not found. }
  /api/v1/print-agent/status:
    get:
      security: [{ printAgentToken: [] }]
      summary: Agent heartbeat and queue counts for local diagnostics
      responses:
        '200': { description: Last poll time, online flag (30 seconds) and counts by state. }
  /api/v1/print-jobs/{id}:
    get:
      summary: Job metadata for authenticated sales readers
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Job status; no receipt content or claim secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrintJob' }
        '404': { description: Job not found. }
  /api/v1/print-jobs/sale/{id}:
    get:
      summary: Last twenty jobs for this sale (sales:read)
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: List of PrintJob metadata. }
  /api/v1/print-jobs/agent-status:
    get:
      summary: Agent heartbeat/counts for authenticated sales readers
      responses:
        '200': { description: Online flag, last poll and queue counts. }
  /api/v1/health:
    get:
      tags:
        - Health
      security: []
      summary: Health probe
      description: Returns basic service availability metadata.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
                required:
                  - status
                  - time
  /api/v1/metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics endpoint
      description: Returns service/process metrics for observability tooling.
      security: []
      parameters:
        - in: header
          name: x-metrics-token
          required: false
          description: Required in production when METRICS_TOKEN is configured.
          schema:
            type: string
      responses:
        '200':
          description: Prometheus metrics payload.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user
      description: >
        Authenticates the user, sets an HttpOnly session cookie for browser clients,
        and returns the authenticated user profile. The backend still accepts Bearer
        tokens for non-browser clients, but the web application does not persist the
        JWT in browser storage anymore.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie for browser sessions.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Clear browser session
      description: Clears the HttpOnly authentication cookie used by browser clients.
      security: []
      responses:
        '204':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              description: Expired authentication cookie.
              schema:
                type: string
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Return authenticated user
      description: Returns details about the currently authenticated user resolved from a bearer token or auth cookie.
      responses:
        '200':
          description: Authenticated user details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
                required:
                  - user
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/product-groups:
    get:
      tags:
        - Catalog
      summary: List product groups
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Product groups ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductGroup'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Catalog
      summary: Create product group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductGroupWrite'
      responses:
        '201':
          description: Product group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/product-groups/{id}:
    get:
      tags:
        - Catalog
      summary: Get product group
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Product group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Catalog
      summary: Update product group
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductGroupPatch'
      responses:
        '200':
          description: Product group updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/products:
    get:
      tags:
        - Catalog
      summary: List products
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Products ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Catalog
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/products/{id}:
    get:
      tags:
        - Catalog
      summary: Get product
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Catalog
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/customers:
    get:
      tags:
        - Customers
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Customers ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Customers
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetails'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Customers
      summary: Update customer
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      responses:
        '200':
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/customers/{id}/payments:
    get:
      tags:
        - Customers
      summary: List customer payments
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: query
          name: start_date
          required: false
          description: Filter payments from this date (inclusive).
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          required: false
          description: Filter payments until this date (inclusive).
          schema:
            type: string
            format: date
        - in: query
          name: method
          required: false
          description: Filter by payment method.
          schema:
            type: string
            enum:
              - cash
              - card
              - bank
              - other
              - legacy
        - in: query
          name: sort
          required: false
          description: Sort direction (payment_date then created_at).
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Payment history ordered by date with summary totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags:
        - Customers
      summary: Register customer payment
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPaymentWrite'
      responses:
        '201':
          description: Payment recorded with updated balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/customers/{id}/payments/report:
    get:
      tags:
        - Customers
      summary: Payment history report
      description: >
        Returns every selected payment in one repeatable-read snapshot, up to 5000 rows.
        Legacy page/page_size query parameters are accepted but never truncate this report.
        Use the payments list endpoint for pagination. Narrow filters if the selection exceeds
        the report limit. Counts, unique identities and decimal sums are checked before returning.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: query
          name: start_date
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: method
          required: false
          schema:
            type: string
            enum:
              - cash
              - card
              - bank
              - other
              - legacy
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Payment history, totals and company header ready for printing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentHistoryReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          description: Selection exceeds 5000 payments; message payment_report_limit_exceeded, details.limit and details.count. No partial report is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Counts, identities or exact decimal sums cannot be reconciled; message payment_report_inconsistent. No partial report is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/customers/{customerId}/payments/{paymentId}/receipt:
    get:
      tags:
        - Customers
      summary: Payment receipt
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receipt payload including balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentReceipt'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/customers/{id}/sales:
    get:
      tags:
        - Customers
      summary: List customer sales history
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Recent sales for the customer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerSale'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/sellers:
    get:
      tags:
        - Catalog
      summary: List sellers
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Sellers ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seller'
    post:
      tags:
        - Catalog
      summary: Create seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerWrite'
      responses:
        '201':
          description: Seller created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sellers/{id}:
    get:
      tags:
        - Catalog
      summary: Get seller
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Seller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Catalog
      summary: Update seller
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerPatch'
      responses:
        '200':
          description: Seller updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/payment-terms:
    get:
      tags:
        - Catalog
      summary: List payment terms
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Payment terms ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTerm'
    post:
      tags:
        - Catalog
      summary: Create payment term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentTermWrite'
      responses:
        '201':
          description: Payment term created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTerm'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
