openapi: 3.0.3
info:
  title: POS Platform API
  version: 0.1.0
  description: >
    REST API for the POS platform providing checkout, backoffice, and
    synchronization capabilities. The API is designed to be idempotent, secure,
    and ready for hybrid deployments.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Customers
  - name: Sales
  - name: Administration
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      security: []
      summary: Health probe
      description: Returns basic service availability metadata.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
                required:
                  - status
                  - time
  /api/v1/metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics endpoint
      description: Returns service/process metrics for observability tooling.
      security: []
      parameters:
        - in: header
          name: x-metrics-token
          required: false
          description: Required in production when METRICS_TOKEN is configured.
          schema:
            type: string
      responses:
        '200':
          description: Prometheus metrics payload.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user
      description: Exchanges user credentials for a JWT bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Return authenticated user
      description: Returns details about the currently authenticated user.
      responses:
        '200':
          description: Authenticated user details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
                required:
                  - user
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/product-groups:
    get:
      tags:
        - Catalog
      summary: List product groups
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Product groups ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductGroup'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Catalog
      summary: Create product group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductGroupWrite'
      responses:
        '201':
          description: Product group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/product-groups/{id}:
    get:
      tags:
        - Catalog
      summary: Get product group
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Product group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Catalog
      summary: Update product group
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductGroupPatch'
      responses:
        '200':
          description: Product group updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroup'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/products:
    get:
      tags:
        - Catalog
      summary: List products
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Products ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Catalog
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/products/{id}:
    get:
      tags:
        - Catalog
      summary: Get product
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Catalog
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/customers:
    get:
      tags:
        - Customers
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Customers ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Customers
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetails'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Customers
      summary: Update customer
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      responses:
        '200':
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/customers/{id}/payments:
    get:
      tags:
        - Customers
      summary: List customer payments
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: query
          name: start_date
          required: false
          description: Filter payments from this date (inclusive).
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          required: false
          description: Filter payments until this date (inclusive).
          schema:
            type: string
            format: date
        - in: query
          name: method
          required: false
          description: Filter by payment method.
          schema:
            type: string
            enum:
              - cash
              - card
              - bank
              - other
              - legacy
        - in: query
          name: sort
          required: false
          description: Sort direction (payment_date then created_at).
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Payment history ordered by date with summary totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags:
        - Customers
      summary: Register customer payment
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPaymentWrite'
      responses:
        '201':
          description: Payment recorded with updated balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/customers/{id}/payments/report:
    get:
      tags:
        - Customers
      summary: Payment history report
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: query
          name: start_date
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: method
          required: false
          schema:
            type: string
            enum:
              - cash
              - card
              - bank
              - other
              - legacy
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Payment history, totals and company header ready for printing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentHistoryReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/customers/{customerId}/payments/{paymentId}/receipt:
    get:
      tags:
        - Customers
      summary: Payment receipt
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Receipt payload including balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentReceipt'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/customers/{id}/sales:
    get:
      tags:
        - Customers
      summary: List customer sales history
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Recent sales for the customer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerSale'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/sellers:
    get:
      tags:
        - Catalog
      summary: List sellers
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Sellers ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seller'
    post:
      tags:
        - Catalog
      summary: Create seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerWrite'
      responses:
        '201':
          description: Seller created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sellers/{id}:
    get:
      tags:
        - Catalog
      summary: Get seller
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Seller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Catalog
      summary: Update seller
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerPatch'
      responses:
        '200':
          description: Seller updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/payment-terms:
    get:
      tags:
        - Catalog
      summary: List payment terms
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Payment terms ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTerm'
    post:
      tags:
        - Catalog
      summary: Create payment term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentTermWrite'
      responses:
        '201':
          description: Payment term created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTerm'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/payment-terms/{id}:
    get:
      tags:
        - Catalog
      summary: Get payment term
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Payment term.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTerm'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Catalog
      summary: Update payment term
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentTermPatch'
      responses:
        '200':
          description: Payment term updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTerm'
        '204':
          description: No fields changed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sales:
    get:
      tags:
        - Sales
      summary: List sales
      parameters:
        - name: from
          in: query
          description: Filter by emission date (inclusive, YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Filter by emission date (inclusive, YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: seller_id
          in: query
          description: Filter by seller identifier.
          schema:
            type: string
            format: uuid
        - name: customer_id
          in: query
          description: Filter by customer identifier.
          schema:
            type: string
            format: uuid
        - name: payment_term_id
          in: query
          description: Filter by payment term identifier.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of records to return (default 100, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Most recent sales first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
    post:
      tags:
        - Sales
      summary: Register sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
      responses:
        '201':
          description: Sale created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sales/{id}:
    get:
      tags:
        - Sales
      summary: Get sale
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Sale with items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/sales/{id}/cancel:
    post:
      tags:
        - Sales
      summary: Cancel sale
      description: >
        Cancels a sale when permitted by RBAC policy. Previously cancelled sales
        return 404 to prevent idempotency violations.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCancel'
      responses:
        '200':
          description: Sale cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/users:
    get:
      tags:
        - Administration
      summary: List users
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Application users ordered by full name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Administration
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/users/{id}:
    get:
      tags:
        - Administration
      summary: Get user
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Administration
      summary: Update user
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      tags:
        - Administration
      summary: Disable user
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: User disabled.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/roles:
    get:
      tags:
        - Administration
      summary: List roles
      responses:
        '200':
          description: Available roles ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Administration
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/roles/{id}:
    get:
      tags:
        - Administration
      summary: Get role
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Role details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/backups:
    get:
      tags:
        - Administration
      summary: List backups
      responses:
        '200':
          description: Available system backups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemBackup'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/backup:
    post:
      tags:
        - Administration
      summary: Create backup
      description: Triggers a full database backup and registers the archive.
      responses:
        '201':
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBackup'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/backup/upload:
    post:
      tags:
        - Administration
      summary: Upload backup archive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup archive (.zip)
              required:
                - file
      responses:
        '201':
          description: Backup uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBackup'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/backup/{filename}:
    delete:
      tags:
        - Administration
      summary: Delete backup
      parameters:
        - $ref: '#/components/parameters/BackupFilename'
      responses:
        '204':
          description: Backup removed.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/backup/{filename}/download:
    get:
      tags:
        - Administration
      summary: Download backup archive
      parameters:
        - $ref: '#/components/parameters/BackupFilename'
      responses:
        '200':
          description: Backup archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/restore:
    post:
      tags:
        - Administration
      summary: Restore backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: Restore accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/import/legacy:
    post:
      tags:
        - Administration
      summary: Import legacy DBF data
      description: >
        Uploads legacy DBF/DBT files (or a ZIP archive) and queues the ETL pipeline
        to rebuild the normalized database from legacy staging tables.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LegacyImportRequest'
      responses:
        '202':
          description: Import accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/import/legacy/{sessionId}/status:
    get:
      tags:
        - Administration
      summary: Get legacy import status
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
      responses:
        '200':
          description: Current status for the legacy import.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/import/legacy/{sessionId}/report:
    get:
      tags:
        - Administration
      summary: Download legacy import reconciliation report
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
      responses:
        '200':
          description: CSV reconciliation report.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackupFilename:
      name: filename
      in: path
      required: true
      description: Backup archive filename.
      schema:
        type: string
    ImportSessionId:
      name: sessionId
      in: path
      required: true
      description: Import session identifier.
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      description: Case insensitive partial match on name, legacy code, or identifier.
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      description: Maximum number of records to return (default 100, max 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
  responses:
    ValidationError:
      description: Request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    BadRequestError:
      description: Request is syntactically valid but semantically invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: bad request
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: resource not found
    ConflictError:
      description: Unique constraint violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: conflict
    UnauthorizedError:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: unauthorized
    ForbiddenError:
      description: Authenticated user lacks permission for the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: forbidden
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                message: internal_error
  schemas:
    ProductGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - id
        - name
    ProductGroupWrite:
      type: object
      properties:
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - name
    ProductGroupPatch:
      allOf:
        - $ref: '#/components/schemas/ProductGroupWrite'
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
        barcode:
          type: string
          nullable: true
        group_id:
          type: string
          format: uuid
          nullable: true
        reference:
          type: string
          nullable: true
        min_stock:
          type: number
          format: float
          nullable: true
        price_cash:
          type: number
          format: float
          nullable: true
        price_base:
          type: number
          format: float
          nullable: true
      required:
        - id
        - name
    ProductWrite:
      type: object
      properties:
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
        barcode:
          type: string
          nullable: true
        group_id:
          type: string
          format: uuid
          nullable: true
        reference:
          type: string
          nullable: true
        min_stock:
          type: number
          format: float
          nullable: true
        price_cash:
          type: number
          format: float
          nullable: true
        price_base:
          type: number
          format: float
          nullable: true
      required:
        - name
    ProductPatch:
      allOf:
        - $ref: '#/components/schemas/ProductWrite'
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
        cpf:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - delinquent
            - inactive
        credit_limit:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - id
        - name
        - status
    CustomerWrite:
      type: object
      properties:
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
        cpf:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
        cep:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - delinquent
            - inactive
          default: active
        credit_limit:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name
    CustomerPatch:
      allOf:
        - $ref: '#/components/schemas/CustomerWrite'
    CustomerDetails:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            totals:
              type: object
              properties:
                total_charges:
                  type: number
                  format: float
                total_payments:
                  type: number
                  format: float
                current_balance:
                  type: number
                  format: float
                last_payment_date:
                  type: string
                  format: date
                  nullable: true
              required:
                - total_charges
                - total_payments
                - current_balance
          required:
            - totals
    CustomerPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        payment_date:
          type: string
          format: date
          nullable: true
        method:
          type: string
          enum:
            - cash
            - card
            - bank
            - other
            - legacy
        reference:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        received_by:
          type: string
          format: uuid
          nullable: true
        received_by_name:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - manual
            - legacy
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - amount
        - method
        - source
    CustomerPaymentWrite:
      type: object
      properties:
        amount:
          type: number
          format: float
          exclusiveMinimum: 0
        payment_date:
          type: string
          format: date
          nullable: true
        method:
          type: string
          enum:
            - cash
            - card
            - bank
            - other
        reference:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - amount
    CustomerPaymentsSummary:
      type: object
      properties:
        total_debt:
          type: number
          format: float
        total_paid:
          type: number
          format: float
        current_balance:
          type: number
          format: float
        filtered_total_paid:
          type: number
          format: float
        filtered_count:
          type: integer
        applied_filters:
          type: object
          properties:
            start_date:
              type: string
              format: date
              nullable: true
            end_date:
              type: string
              format: date
              nullable: true
            method:
              type: string
              enum:
                - cash
                - card
                - bank
                - other
                - legacy
              nullable: true
            sort:
              type: string
              enum:
                - asc
                - desc
          required:
            - sort
      required:
        - total_debt
        - total_paid
        - current_balance
        - filtered_total_paid
        - filtered_count
        - applied_filters
    CustomerPaymentsResponse:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CustomerPayment'
        summary:
          $ref: '#/components/schemas/CustomerPaymentsSummary'
      required:
        - payments
        - summary
    CustomerPaymentCreatedResponse:
      type: object
      properties:
        payment:
          $ref: '#/components/schemas/CustomerPayment'
        summary:
          type: object
          properties:
            total_debt:
              type: number
              format: float
            total_paid:
              type: number
              format: float
            previous_balance:
              type: number
              format: float
            new_balance:
              type: number
              format: float
          required:
            - total_debt
            - total_paid
            - previous_balance
            - new_balance
        receipt_hint:
          type: string
          nullable: true
      required:
        - payment
        - summary
    CompanyInfo:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        tax_id:
          type: string
      required:
        - name
        - address
        - tax_id
    CustomerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
        cpf:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        uf:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
      required:
        - id
        - name
    CustomerPaymentReceipt:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/CompanyInfo'
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        payment:
          allOf:
            - $ref: '#/components/schemas/CustomerPayment'
            - type: object
              properties:
                code:
                  type: string
        balances:
          type: object
          properties:
            total_debt:
              type: number
              format: float
            total_paid:
              type: number
              format: float
            previous_balance:
              type: number
              format: float
            payment_amount:
              type: number
              format: float
            new_balance:
              type: number
              format: float
          required:
            - total_debt
            - total_paid
            - previous_balance
            - payment_amount
            - new_balance
        generated_at:
          type: string
          format: date-time
      required:
        - company
        - customer
        - payment
        - balances
        - generated_at
    CustomerPaymentHistoryReport:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        company:
          $ref: '#/components/schemas/CompanyInfo'
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CustomerPayment'
        summary:
          $ref: '#/components/schemas/CustomerPaymentsSummary'
      required:
        - generated_at
        - company
        - customer
        - payments
        - summary
    CustomerSale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        emission_date:
          type: string
          format: date
          nullable: true
        order_number:
          type: string
          nullable: true
        total:
          type: number
          format: float
          nullable: true
        status:
          type: string
          enum:
            - draft
            - completed
            - cancelled
      required:
        - id
        - status
    Seller:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - id
        - name
    SellerWrite:
      type: object
      properties:
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - name
    SellerPatch:
      allOf:
        - $ref: '#/components/schemas/SellerWrite'
    PaymentTerm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - id
        - name
    PaymentTermWrite:
      type: object
      properties:
        legacy_code:
          type: string
          nullable: true
        name:
          type: string
      required:
        - name
    PaymentTermPatch:
      allOf:
        - $ref: '#/components/schemas/PaymentTermWrite'
    SaleItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: number
          format: float
        unit_price:
          type: number
          format: float
        total:
          type: number
          format: float
      required:
        - id
        - product_id
        - quantity
        - unit_price
        - total
    Sale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        emission_date:
          type: string
          format: date
        order_number:
          type: string
          nullable: true
        seller_id:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          format: uuid
          nullable: true
        payment_term_id:
          type: string
          format: uuid
          nullable: true
        subtotal:
          type: number
          format: float
        discount:
          type: number
          format: float
        total:
          type: number
          format: float
        status:
          type: string
          enum:
            - draft
            - completed
            - cancelled
        source:
          type: string
          nullable: true
        source_key:
          type: string
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancellation_reason:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'
      required:
        - id
        - emission_date
        - subtotal
        - discount
        - total
        - status
        - items
    SaleItemWrite:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: number
          format: float
          minimum: 0
        unit_price:
          type: number
          format: float
          minimum: 0
        total:
          type: number
          format: float
          nullable: true
      required:
        - product_id
        - quantity
        - unit_price
    SaleCreate:
      type: object
      properties:
        emission_date:
          type: string
          format: date
        order_number:
          type: string
          nullable: true
        seller_id:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          format: uuid
          nullable: true
        payment_term_id:
          type: string
          format: uuid
          nullable: true
        subtotal:
          type: number
          format: float
          nullable: true
        discount:
          type: number
          format: float
          nullable: true
        total:
          type: number
          format: float
          nullable: true
        source:
          type: string
          nullable: true
        source_key:
          type: string
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItemWrite'
      required:
        - items
    SaleCancel:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
        discountLimit:
          type: number
          format: float
      required:
        - id
        - name
        - permissions
        - discountLimit
    RoleCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
        discountLimit:
          type: number
          format: float
